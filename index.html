<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vrai Générateur IA HTML</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librairie Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧠 Vrai Générateur IA HTML</h1>
            <p>Demande n'importe quoi à l'IA, elle code ton bloc sur mesure et le sauvegarde sur Supabase.</p>
        </header>

        <main class="grid">
            <!-- Zone de prompt IA -->
            <section class="card">
                <h2>1. Dis à l'IA ce que tu veux</h2>
                <div class="form-group">
                    <label for="promptInput">Décris ton design en détail :</label>
                    <textarea id="promptInput" placeholder="Ex: Une carte de profil stylée avec un fond sombre, un avatar rond, mon nom en grand, une bio et un bouton violet 'Suivre'..."></textarea>
                </div>

                <button id="generateBtn">🤖 Générer avec l'IA</button>
            </section>

            <!-- Résultat et Code -->
            <section class="card">
                <h2>2. Code HTML Généré par l'IA</h2>
                <div class="code-output">
                    <pre><code id="codeDisplay">&lt;!-- Le code apparaîtra ici après votre demande --&gt;</code></pre>
                </div>
                <button id="copyBtn" class="secondary-btn">Copier le code</button>
                <button id="saveBtn" class="save-btn" style="margin-top: 10px;">💾 Sauvegarder dans Supabase</button>
                <p id="saveStatus" style="font-size: 0.85rem; margin-top: 8px; text-align: center;"></p>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
